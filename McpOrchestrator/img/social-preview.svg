<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#17121F"/>
  <rect x="14" y="14" width="1252" height="612" rx="28" fill="none" stroke="#2B2240" stroke-width="3"/>

  <!-- ============ LEFT: wordmark + copy ============ -->
  <!-- small mark -->
  <g transform="translate(84,84) scale(0.17)">
    <rect x="0" y="0" width="512" height="512" rx="104" fill="#1F1930"/>
    <path d="M 256 256 C 320 256 320 148 384 148" fill="none" stroke="#4A3F66" stroke-width="18" stroke-linecap="round" stroke-dasharray="2 34"/>
    <path d="M 256 256 C 320 256 320 364 384 364" fill="none" stroke="#4A3F66" stroke-width="18" stroke-linecap="round" stroke-dasharray="2 34"/>
    <path d="M 96 256 L 232 256" fill="none" stroke="#FFAE45" stroke-width="20" stroke-linecap="round"/>
    <path d="M 280 256 L 384 256" fill="none" stroke="#FFAE45" stroke-width="20" stroke-linecap="round"/>
    <circle cx="404" cy="148" r="26" fill="none" stroke="#4A3F66" stroke-width="14"/>
    <circle cx="404" cy="256" r="26" fill="#FFAE45"/>
    <circle cx="404" cy="364" r="26" fill="none" stroke="#4A3F66" stroke-width="14"/>
    <circle cx="88" cy="256" r="26" fill="#8B7CF7"/>
    <rect x="216" y="216" width="80" height="80" rx="18" fill="#1F1930" stroke="#8B7CF7" stroke-width="16" transform="rotate(45 256 256)"/>
  </g>

  <text x="196" y="141" font-family="Inter" font-weight="bold" font-size="52" fill="#F2EEFB">McpOrchestrator</text>

  <text x="86" y="232" font-family="Inter" font-size="27" fill="#A79BC8">One relay between your agent</text>
  <text x="86" y="272" font-family="Inter" font-size="27" fill="#A79BC8">and every MCP server.</text>

  <!-- stat block -->
  <text x="86" y="368" font-family="JetBrains Mono" font-weight="bold" font-size="44" fill="#6E6193">17,900</text>
  <text x="262" y="368" font-family="JetBrains Mono" font-size="44" fill="#4A3F66">&#8594;</text>
  <text x="316" y="368" font-family="JetBrains Mono" font-weight="bold" font-size="44" fill="#FFAE45">1,400</text>
  <text x="86" y="404" font-family="JetBrains Mono" font-size="19" fill="#A79BC8">tokens in context &#183; ~13&#215; smaller</text>

  <text x="86" y="470" font-family="Inter" font-size="21" fill="#8B7CF7">Tool manifests load on demand &#8212; context stays flat</text>
  <text x="86" y="502" font-family="Inter" font-size="21" fill="#8B7CF7">as you add servers. Pure stdio relay, .NET-native.</text>

  <text x="86" y="568" font-family="JetBrains Mono" font-size="18" fill="#6E6193">github.com/Byggarepop/dotnet-mcp-orchestrator</text>

  <!-- ============ RIGHT: relay diagram ============ -->
  <g transform="translate(700,0)">
    <!-- dormant routes -->
    <path d="M 260 320 C 350 320 350 130 440 130" fill="none" stroke="#4A3F66" stroke-width="9" stroke-linecap="round" stroke-dasharray="1 20"/>
    <path d="M 260 320 C 350 320 350 256 440 256" fill="none" stroke="#4A3F66" stroke-width="9" stroke-linecap="round" stroke-dasharray="1 20"/>
    <path d="M 260 320 C 350 320 350 510 440 510" fill="none" stroke="#4A3F66" stroke-width="9" stroke-linecap="round" stroke-dasharray="1 20"/>

    <!-- active route -->
    <path d="M 88 320 L 260 320" fill="none" stroke="#FFAE45" stroke-width="10" stroke-linecap="round"/>
    <path d="M 260 320 C 350 320 350 384 440 384" fill="none" stroke="#FFAE45" stroke-width="10" stroke-linecap="round"/>
    <text x="330" y="428" font-family="JetBrains Mono" font-size="17" fill="#FFAE45">route()</text>

    <!-- agent -->
    <circle cx="80" cy="320" r="17" fill="#8B7CF7"/>
    <text x="80" y="374" font-family="JetBrains Mono" font-size="17" fill="#A79BC8" text-anchor="middle">agent</text>

    <!-- orchestrator diamond -->
    <rect x="222" y="282" width="76" height="76" rx="14" fill="#17121F" stroke="#8B7CF7" stroke-width="11" transform="rotate(45 260 320)"/>
    <text x="260" y="432" font-family="JetBrains Mono" font-size="17" fill="#A79BC8" text-anchor="middle">orchestrator</text>

    <!-- servers -->
    <circle cx="452" cy="130" r="15" fill="none" stroke="#4A3F66" stroke-width="8"/>
    <text x="486" y="137" font-family="JetBrains Mono" font-size="18" fill="#6E6193">jira</text>

    <circle cx="452" cy="256" r="15" fill="none" stroke="#4A3F66" stroke-width="8"/>
    <text x="486" y="263" font-family="JetBrains Mono" font-size="18" fill="#6E6193">files</text>

    <circle cx="452" cy="384" r="15" fill="#FFAE45"/>
    <text x="486" y="391" font-family="JetBrains Mono" font-size="18" fill="#FFAE45">tokensaver</text>

    <circle cx="452" cy="510" r="15" fill="none" stroke="#4A3F66" stroke-width="8"/>
    <text x="486" y="517" font-family="JetBrains Mono" font-size="18" fill="#6E6193">codegen</text>
  </g>
</svg>
